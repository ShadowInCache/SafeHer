name: SafeHer Mobile CI

on:
  push:
    paths:
      - "SafeHer/mobile/**"
      - "SafeHer/.github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "SafeHer/mobile/**"
      - "SafeHer/.github/workflows/mobile-ci.yml"

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SafeHer/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib/main.dart lib/app

      - name: Run tests
        run: flutter test --reporter expanded
