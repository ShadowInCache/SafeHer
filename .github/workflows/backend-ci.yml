name: SafeHer Backend CI

on:
  push:
    paths:
      - "fastapi_app/**"
      - "alembic/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-backend.txt"
      - "alembic.ini"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "fastapi_app/**"
      - "alembic/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-backend.txt"
      - "alembic.ini"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    services:
      # Production runs Postgres. Until this existed every check below ran
      # on SQLite, and the two disagree about booleans, type strictness and
      # string comparison. That gap shipped migration 0007 containing
      # `is_verified = 1`, which passed the entire suite here and raised
      # "operator does not exist: boolean = integer" the first time it met
      # a real Postgres -- aborting the chain midway, schema half-applied.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: safeher
          POSTGRES_PASSWORD: safeher
          POSTGRES_DB: safeher_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safeher"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # A throwaway secret: config.py refuses to start without one outside
      # development, and CI must not depend on a real value.
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else
      DATABASE_URL: sqlite:///./ci_safeher.db
      ENABLE_MQTT_WORKER: "false"
      LOG_LEVEL: WARNING
      ENVIRONMENT: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements-backend.txt rather than requirements.txt: the latter also
      # carries the ML training stack (torch, ultralytics, librosa -- several
      # GB) that nothing under fastapi_app/ or tests/ imports.
      #
      # That file is a pinned subset, verified by installing it into an empty
      # venv and importing the app. Doing so found three gaps a hand-written
      # package list had missed: cloudinary (imported unconditionally by
      # routers/media.py), email-validator (required by pydantic's EmailStr),
      # and a paho-mqtt 1.x pin -- asyncio-mqtt 0.13 references
      # paho.mqtt.client.WebsocketWrapper, which paho 2.x renamed.
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-backend.txt

      - name: Verify migrations run from an empty database
        # Guards the class of bug that let this repo ship six migrations that
        # had never been applied: a schema built by create_all diverges silently
        # from the migration chain.
        run: |
          rm -f ci_safeher.db
          python -m alembic upgrade head
          python -m alembic current

      - name: Verify migrations are reversible
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head

      # test_api_gateway.py and test_integration.py drive a live server over
      # HTTP rather than the ASGI app, so they need a running backend and are
      # excluded from this job.
      - name: Verify migrations run on Postgres
        # The engine production actually uses. The whole chain from empty,
        # then one step back and forward again, so a migration that only
        # works on SQLite fails here rather than on a deploy.
        env:
          DATABASE_URL: postgresql://safeher:safeher@localhost:5432/safeher_ci
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic downgrade -1
          python -m alembic upgrade head

      - name: Run in-process test suites
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_api_gateway.py \
            --ignore=tests/test_integration.py

      - name: Verify the app connects on Postgres
        # Most test modules pin DATABASE_URL to SQLite at import time, so
        # this is not the suite re-run against Postgres -- it is a boot
        # check plus the modules that read the environment. Deliberately
        # not a substitute for the SQLite run above.
        env:
          DATABASE_URL: postgresql://safeher:safeher@localhost:5432/safeher_ci
        run: |
          python -m pytest tests/test_database_url.py -q
          python scripts/ci_postgres_boot_check.py

      - name: Check no secrets or artifacts are tracked
        # Cheap regression guard: this repo has twice shipped committed
        # artifacts and once a live Supabase key.
        run: |
          set -e
          fail=0
          for pattern in '__pycache__' '\.db$' 'chrome_fresh_profile' '(^|/)\.env$' '\.enc$' 'evidence_store/' 'firebase-adminsdk' 'service.?account.*\.json$' '(^|/)secrets/'; do
            count=$(git ls-files | grep -cE "$pattern" || true)
            if [ "$count" -ne 0 ]; then
              echo "::error::$count tracked file(s) match '$pattern'"
              git ls-files | grep -E "$pattern" | head -5
              fail=1
            fi
          done
          exit $fail
