# Sized for a 16 GB machine, not a build server. The previous -Xmx8G with a 4 GB
# metaspace let one daemon ask for 12 GB before the Kotlin and javac daemons,
# the Dart toolchain and Windows had taken their share -- so `flutter build apk
# --release` died with "Gradle build daemon disappeared unexpectedly": no OOM
# stack and no compile error, because the JVM was killed rather than failing.
# 3 GB builds this project with room to spare; raise it only with evidence of a
# real heap exhaustion (which prints a stack, unlike a killed process).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Two workers for the same reason: each one is another JVM.
org.gradle.workers.max=2
android.useAndroidX=true
# Disable Kotlin incremental compilation: project (drive A:) and Gradle/Pub
# caches (drive C:) are on different drives, and Windows cannot compute a
# relative path across drive letters, which crashes the incremental cache
# writer for every Kotlin-based plugin.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
