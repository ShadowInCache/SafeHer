# Disable Kotlin incremental compilation: project (drive A:) and Gradle/Pub
# caches (drive C:) are on different drives, and Windows cannot compute a
# relative path across drive letters, which crashes the incremental cache
# writer for every Kotlin-based plugin.
kotlin.incremental=false
