<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AI-powered wearable safety companion for women.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#14130E">
  <meta name="apple-mobile-web-app-title" content="SafeHer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SafeHer</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- System Font Fallback for Web -->
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  
  <!-- Error handling for failed resources -->
  <script>
    // Suppress font loading errors
    window.addEventListener('error', function(e) {
      if (e.message && (e.message.indexOf('fonts.gstatic.com') > -1 || 
          e.message.indexOf('canvaskit.js') > -1)) {
        console.warn('External resource loading failed, using fallbacks');
        return true;
      }
    }, true);
  </script>
</body>
</html>
