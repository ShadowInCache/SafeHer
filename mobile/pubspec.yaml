name: safeher_app
description: AI-Powered Wearable Safety Application for Women
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # DI
  get_it: ^7.6.7
  injectable: ^2.3.2

  # Networking / realtime
  dio: ^5.4.3
  # Direct, not transitive: certificate_pinning_io.dart hashes DER
  # certificates with it.
  crypto: ^3.0.3
  mqtt_client: ^10.0.0
  web_socket_channel: ^2.4.0

  # Local storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0

  # Native Google account picker. firebase_auth's own signInWithProvider
  # falls back to a web flow on Android/iOS, which shows a browser sheet
  # instead of the device's Google accounts — this gives the real picker.
  google_sign_in: ^6.2.1
  firebase_messaging: ^15.0.0
  cloud_firestore: ^5.1.0

  # Motion / graphics
  flutter_animate: ^4.5.0
  rive: ^0.13.2
  lottie: ^3.1.0
  animations: ^2.0.11

  # 3D model rendering — added on explicit request, not part of the
  # original locked tech stack. No SafeHer-branded .glb assets exist yet,
  # so components using this point at Google's official model-viewer.dev
  # sample models as clearly-labeled stand-ins until real models land.
  model_viewer_plus: ^1.9.3

  # Typography / design
  google_fonts: ^6.2.1

  # Maps / location
  google_maps_flutter: ^2.7.0
  geolocator: ^11.0.0

  # Media
  camera: ^0.11.0
  record: ^6.1.2
  # Temp directory for an in-progress evidence recording, before it is
  # uploaded and the local copy deleted.
  path_provider: ^2.1.3
  chewie: ^1.7.0

  # Data viz
  fl_chart: ^0.68.0

  # Hardware
  flutter_blue_plus: ^1.31.0
  permission_handler: ^11.3.1

  # Accelerometer feed behind the opt-in shake trigger (Settings > Safety).
  sensors_plus: ^6.0.0

  # On-device speech recognition, used twice over. It backs the voice-command
  # layer, and while a journey is armed it also feeds the threat classifier in
  # core/audio. Nothing is recorded or uploaded either way: recognised text is
  # matched or scored on the device and then discarded, and only the resulting
  # number ever leaves the phone.
  #
  # Chosen over a bundled Whisper on measurement. `tiny.en` was benchmarked on
  # BERSt at 60% word error rate on *non-shouted* speech, which is unusable;
  # the platform's own recogniser is both better and already installed.
  speech_to_text: ^7.0.0

  # Real-time weapon detection on the glasses' video stream. Ultralytics'
  # first-party plugin, running the LiteRT export of the model trained in
  # `D:/SafeHer-ML/weapon_detection` (mAP@0.5 0.906 on 658 held-out images).
  #
  # Android only — there is no web implementation, so the web build must never
  # start `WeaponDetectionService`; see assets/models/README.md for the split.
  ultralytics_yolo: ^0.6.14

  # Dialling helplines / nearby places and handing a destination to the
  # device's own maps app. No embedded third-party SDK.
  url_launcher: ^6.3.0
  # Hands the exported incident report to the system share sheet, which
  # is how a report actually reaches a lawyer or a police officer.
  share_plus: ^10.0.2

  # Biometric unlock (FR-AUTH-05) — Face ID / Fingerprint, Profile > Security
  local_auth: ^2.3.0

  # Formatting
  intl: ^0.20.2

  # Injectable wall clock. `clock.now()` is `DateTime.now()` in production and
  # a fixed instant inside `withClock`, which is what lets the home goldens
  # stop depending on what time of day the suite happens to run.
  clock: ^1.1.1

  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Misc used by connectivity-aware offline queue
  connectivity_plus: ^6.1.4
  flutter_foreground_task: ^10.0.0
  multicast_dns: ^0.3.3+1

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  injectable_generator: ^2.4.1
  golden_toolkit: ^0.15.0
  mockito: ^5.4.4
  webview_flutter_platform_interface: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
    - assets/rive/
    # The trained models. Bundled rather than downloaded: they are safety
    # inputs, and a model fetched on first launch is one a woman does not have
    # when she is offline.
    #
    #   weapon_yolov8n_fp16.tflite  6.13 MB  read by ultralytics_yolo
    #   phrase_classifier.json      0.20 MB  read by core/audio, pure Dart
    #   emotion_mobilenetv3_fp16    3.09 MB  NOT wired — supporting evidence
    #                                        only, and barred from the score
    #
    # See assets/models/README.md for what each one measured and why the
    # emotion model cannot touch the threat score.
    - assets/models/
    # Archivo / Archivo Narrow / JetBrains Mono, bundled rather than fetched.
    #
    # `google_fonts` downloads a family the first time it is asked for and
    # caches it on the device, which means the first launch after install
    # renders in Roboto until the network answers -- and on a device that is
    # offline or behind a captive portal, it never stops rendering in Roboto.
    # For an app whose whole job happens when something has gone wrong, the
    # typography should not depend on connectivity.
    #
    # Declared as plain assets, not under `fonts:`. `google_fonts` checks the
    # asset manifest for a file whose name matches its own API convention
    # (`<Family>-<Variant>.ttf`) before it reaches for the network, so these
    # names are load-bearing: rename one and it silently starts downloading
    # again. The files are byte-identical to what it would have fetched.
    - assets/fonts/

# App icon generation. Run `dart run flutter_launcher_icons` after changing
# assets/branding/*.
#
# The launcher icon is the triangle mark alone, never the full lock-up: at 48dp
# the "SafeHer" wordmark renders as illegible grey mush, which reads as a broken
# image rather than a brand.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon.png"
  # Adaptive icon for Android 8+. The system masks the foreground to a circle
  # or squircle and guarantees only the centre ~66%, so the foreground asset
  # is drawn smaller than the legacy icon on purpose -- sized to the canvas it
  # would lose the triangle's base corners on every Pixel.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  remove_alpha_ios: true
