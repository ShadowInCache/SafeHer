name: safeher_app
description: AI-Powered Women's Safety Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  uuid: ^4.5.1
  flutter_blue_plus: ^1.35.5
  permission_handler: ^11.4.0
  mqtt_client: ^10.5.1
  web_socket_channel: ^3.0.1
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  path_provider: ^2.1.5
  path: ^1.9.1
  sqflite: ^2.4.2
  google_maps_flutter: ^2.12.2

  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.9
  firebase_messaging: ^15.2.5
  firebase_crashlytics: ^4.3.5
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
