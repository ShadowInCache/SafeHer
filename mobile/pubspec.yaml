name: safeher_app
description: AI-Powered Wearable Safety Application for Women
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # DI
  get_it: ^7.6.7
  injectable: ^2.3.2

  # Networking / realtime
  dio: ^5.4.3
  # Direct, not transitive: certificate_pinning_io.dart hashes DER
  # certificates with it.
  crypto: ^3.0.3
  mqtt_client: ^10.0.0
  web_socket_channel: ^2.4.0

  # Local storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0

  # Native Google account picker. firebase_auth's own signInWithProvider
  # falls back to a web flow on Android/iOS, which shows a browser sheet
  # instead of the device's Google accounts — this gives the real picker.
  google_sign_in: ^6.2.1
  firebase_messaging: ^15.0.0
  cloud_firestore: ^5.1.0

  # Motion / graphics
  flutter_animate: ^4.5.0
  rive: ^0.13.2
  lottie: ^3.1.0
  animations: ^2.0.11

  # 3D model rendering — added on explicit request, not part of the
  # original locked tech stack. No SafeHer-branded .glb assets exist yet,
  # so components using this point at Google's official model-viewer.dev
  # sample models as clearly-labeled stand-ins until real models land.
  model_viewer_plus: ^1.9.3

  # Typography / design
  google_fonts: ^6.2.1

  # Maps / location
  google_maps_flutter: ^2.7.0
  geolocator: ^11.0.0

  # Media
  camera: ^0.11.0
  record: ^6.1.2
  # Temp directory for an in-progress evidence recording, before it is
  # uploaded and the local copy deleted.
  path_provider: ^2.1.3
  chewie: ^1.7.0

  # Data viz
  fl_chart: ^0.68.0

  # Hardware
  flutter_blue_plus: ^1.31.0
  permission_handler: ^11.3.1

  # Accelerometer feed behind the opt-in shake trigger (Settings > Safety).
  sensors_plus: ^6.0.0

  # On-device speech recognition for the voice-command layer. Nothing is
  # recorded or uploaded — recognised text is matched locally against a fixed
  # command list and discarded.
  speech_to_text: ^7.0.0

  # Dialling helplines / nearby places and handing a destination to the
  # device's own maps app. No embedded third-party SDK.
  url_launcher: ^6.3.0

  # Biometric unlock (FR-AUTH-05) — Face ID / Fingerprint, Profile > Security
  local_auth: ^2.3.0

  # Formatting
  intl: ^0.20.2

  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Misc used by connectivity-aware offline queue
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  injectable_generator: ^2.4.1
  golden_toolkit: ^0.15.0
  mockito: ^5.4.4
  webview_flutter_platform_interface: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
    - assets/rive/
