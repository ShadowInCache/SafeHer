# SafeHer Redis Configuration

# Basic Configuration
bind 0.0.0.0
port 6379
protected-mode no

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence (Development)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename safeher_dump.rdb
dir /data

# Logging
loglevel notice
logfile ""

# Security (Development - Basic)
requirepass ""

# Performance
tcp-backlog 511
timeout 300
tcp-keepalive 300

# Pub/Sub
notify-keyspace-events Ex

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128