# SafeHer MQTT Broker Configuration

# Basic Configuration
max_inflight_messages 20
max_queued_messages 100
allow_zero_length_clientid true

# Persistence
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Default Listener (Non-SSL)
listener 1883
protocol mqtt
allow_anonymous true

# WebSocket Listener  
listener 9001
protocol websockets
allow_anonymous true

# SSL/TLS Listener (when certificates available)
# listener 8883
# protocol mqtt
# cafile /mosquitto/config/ssl/ca.crt
# certfile /mosquitto/config/ssl/server.crt
# keyfile /mosquitto/config/ssl/server.key
# allow_anonymous false
# require_certificate false